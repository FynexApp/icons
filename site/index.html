<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* The base the validated prototype was rendered on (the artifact page skeleton), kept so the site stays identical. */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; padding: 0; }
img { max-width: 100%; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
</style>
<title>Fynex Icons</title>
<meta name="description" content="Animated icon set for React, open source, made by Fynex.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Poppins:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* A candlelit gallery: old paintings hung in the dark, and the icons in gold leaf set beside them like wall labels. A single theme, on purpose. */
:root {
  --ink: #0a0806;
  --umber: #14100b;
  --umber-2: #1c1610;
  --sand: #d6bf9e;
  --candle: #f6dfae;
  --ash: #8f8372;
  --rule: rgba(214, 191, 158, 0.13);
  --rule-strong: rgba(214, 191, 158, 0.28);
  --display: 'Cormorant Garamond', 'EB Garamond', Garamond, 'Times New Roman', serif;
  --body: 'Poppins', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --gutter: clamp(20px, 4.5vw, 64px);
  --frame: 6px;
  color-scheme: dark;
}
html { background: var(--ink); scroll-behavior: smooth; }
body { background: var(--ink); color: var(--sand); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--candle); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The gilded frame around the page */
.frame { position: fixed; inset: 0; z-index: 30; pointer-events: none; border: var(--frame) solid var(--umber-2); box-shadow: inset 0 0 0 1px var(--rule-strong); }

.page { padding-inline: var(--gutter); max-width: 1480px; margin: 0 auto; }

/* Bar */
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 26px 22px; border-bottom: 1px dotted var(--rule-strong); }
.bar-left { display: flex; gap: 28px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
.bar-left a { color: var(--ash); text-decoration: none; transition: color 160ms var(--ease); }
.bar-left a:hover { color: var(--candle); }
.mark { display: grid; justify-items: center; text-decoration: none; color: var(--candle); line-height: 0.9; }
.mark-word { font-family: var(--display); font-size: 30px; font-weight: 500; letter-spacing: 0.02em; }
.mark-sub { font-size: 9.5px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--ash); padding-left: 0.42em; margin-top: 3px; }
.bar-right { display: flex; justify-content: flex-end; align-items: center; gap: 20px; font-size: 13px; }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 9px; overflow: hidden; }
.lang button { padding: 5px 11px; color: var(--ash); font-size: 12px; letter-spacing: 0.08em; transition: color 160ms var(--ease), background 160ms var(--ease); }
.lang button[aria-pressed="true"] { color: var(--ink); background: var(--sand); }
.gh { color: var(--ash); text-decoration: none; transition: color 160ms var(--ease); }
.gh:hover { color: var(--candle); }

/* Opening */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) auto minmax(0, 0.95fr); gap: clamp(24px, 4vw, 64px); align-items: center; padding-block: clamp(40px, 6vw, 88px); }
.hero-copy { min-width: 0; }
.eyebrow { margin: 0 0 22px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ash); }
h1 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(52px, 7.4vw, 116px); line-height: 0.9; letter-spacing: -0.015em; color: var(--candle); text-wrap: balance; }
h1 span { display: block; }
h1 .em { font-style: italic; color: var(--sand); padding-left: 0.5em; }
.lede { max-width: 46ch; margin: 30px 0 0; color: var(--ash); font-size: 15px; font-weight: 300; }
.specs { display: flex; flex-wrap: wrap; gap: 8px 22px; list-style: none; padding: 0; margin: 26px 0 0; font-family: var(--mono); font-size: 12px; color: var(--ash); }
.specs strong { color: var(--candle); font-weight: 400; }

.hero-icons { display: grid; grid-template-columns: repeat(2, 64px); grid-auto-rows: 64px; gap: 6px 28px; }
.hero-icon { display: grid; place-items: center; color: var(--sand); opacity: 0.6; transition: opacity 260ms var(--ease), color 260ms var(--ease); }
.hero-icon.is-lit { opacity: 1; color: var(--candle); }

.painting, .family-art { margin: 0; min-width: 0; }
.painting img, .family-art img { display: block; width: 100%; height: auto; max-width: 100%; }
.painting img { aspect-ratio: 880 / 1101; object-fit: cover; }
.painting img, .family-art img { --fade: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(to bottom, transparent, #000 9%, #000 84%, transparent); -webkit-mask-image: var(--fade); mask-image: var(--fade); -webkit-mask-composite: source-in; mask-composite: intersect; }
figcaption { margin-top: 10px; font-family: var(--display); font-style: italic; font-size: 14px; line-height: 1.35; color: var(--ash); text-wrap: balance; }

/* Section headings, with their icon as a superscript */
.section-head { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); align-items: end; gap: 12px 48px; padding-block: 72px 26px; }
.section-head h2 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(48px, 6vw, 84px); line-height: 0.95; color: var(--candle); letter-spacing: -0.01em; }
.section-head p { margin: 0; max-width: 54ch; color: var(--ash); font-weight: 300; justify-self: end; }
.sup { display: inline-block; vertical-align: top; margin-left: 0.18em; color: var(--sand); line-height: 1; position: relative; top: 0.12em; }
h3 .sup { top: 0.05em; }

/* Install: three cards laid over duotone paintings */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; row-gap: 14px; }
/* The four text lines of each card share the grid rows: titles, commands and notes line up from one card to the next. */
.card { position: relative; display: grid; grid-row: span 5; grid-template-rows: subgrid; row-gap: 12px; min-width: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--umber); isolation: isolate; }
.card > :is(.card-tag, h3, .snippet, .card-note) { margin-inline: 22px; min-width: 0; }
.card-space { min-height: 170px; }
.card > .card-note { margin-bottom: 22px; }
.card-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0.85; transition: transform 700ms var(--ease), opacity 400ms var(--ease); }
.card::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, rgba(10, 8, 6, 0.15), rgba(10, 8, 6, 0.55) 45%, rgba(10, 8, 6, 0.92)); }
.card:hover .card-art { transform: scale(1.03); opacity: 1; }

.card-tag { display: flex; align-items: center; align-self: end; gap: 8px; margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--sand); }
.card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; color: var(--candle); }
.card-note { margin: 0; font-size: 13px; color: var(--sand); opacity: 0.8; font-weight: 300; }
.card-credit { position: absolute; top: 14px; left: 16px; right: 16px; margin: 0; font-family: var(--display); font-style: italic; font-size: 12.5px; color: var(--sand); opacity: 0; transition: opacity 260ms var(--ease); }
.card:hover .card-credit, .card:focus-within .card-credit { opacity: 0.85; }

.snippet { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 9px 9px 13px; border: 1px solid var(--rule); border-radius: 9px; background: rgba(10, 8, 6, 0.78); font-family: var(--mono); font-size: 12.5px; }
.snippet code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; color: var(--sand); scrollbar-width: none; }
.snippet code::-webkit-scrollbar { display: none; }
.prompt { color: var(--ash); }
.copy { flex: none; font-family: var(--body); font-size: 11px; letter-spacing: 0.06em; color: var(--ash); padding: 4px 9px; border: 1px solid var(--rule); border-radius: 7px; transition: color 160ms var(--ease), border-color 160ms var(--ease); }
.copy:hover { color: var(--candle); border-color: var(--rule-strong); }

/* Search */
.browse { padding-bottom: 40px; scroll-margin-top: 0; }
.browse .section-head { padding-bottom: 18px; }
.search-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 calc(-1 * var(--gutter)); padding: 16px var(--gutter) 10px; background: color-mix(in srgb, var(--ink) 93%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px dotted var(--rule-strong); }
.search { display: flex; align-items: center; gap: 14px; padding: 0 14px 0 18px; height: 58px; border: 1px solid var(--rule-strong); border-radius: 12px; background: var(--umber); color: var(--ash); transition: border-color 160ms var(--ease), color 160ms var(--ease); }
.search:focus-within { border-color: var(--sand); color: var(--candle); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--candle); font-family: var(--display); font-size: 24px; }
.search input::placeholder { color: var(--ash); opacity: 0.7; font-style: italic; }
.search input::-webkit-search-cancel-button { display: none; }
kbd { font-family: var(--mono); font-size: 12px; color: var(--ash); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 2px 8px; }
.clear { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--ash); }
.clear:hover { color: var(--candle); background: var(--umber-2); }
.filters { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 9px; font-size: 12.5px; color: var(--ash); transition: color 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease); }
.filters button span { font-family: var(--mono); font-size: 11px; opacity: 0.75; }
.filters button:hover:not(:disabled) { color: var(--candle); border-color: var(--rule-strong); }
.filters button[aria-pressed="true"] { color: var(--ink); background: var(--sand); border-color: var(--sand); }
.filters button:disabled { opacity: 0.35; cursor: default; }
.hint { display: flex; justify-content: space-between; gap: 12px; margin: 10px 2px 0; font-size: 12px; color: var(--ash); }
.count { font-family: var(--mono); }

/* Families: the painting on the left, pinned while the family scrolls by */
.family { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); padding-top: 56px; align-items: start; }
.family-art { position: sticky; top: 190px; }
.family-art img { aspect-ratio: 4 / 5; object-fit: cover; }
.family-main { min-width: 0; }
.family-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 8px 22px; padding-bottom: 16px; border-bottom: 1px dotted var(--rule-strong); }
.family-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 3.6vw, 48px); line-height: 1; color: var(--candle); }
.family-head p { grid-column: 1 / -1; margin: 0; max-width: 62ch; font-size: 13.5px; color: var(--ash); font-weight: 300; }
.family-count { font-family: var(--mono); font-size: 12px; color: var(--ash); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
.grid.flat { margin-top: 18px; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; padding: 26px 8px 18px; border-bottom: 1px solid var(--rule); color: var(--sand); text-align: center; transition: color 180ms var(--ease), background 180ms var(--ease); }
.cell-icon { display: grid; place-items: center; height: 30px; }
.cell-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; color: var(--ash); transition: color 180ms var(--ease); }
.cell-via { max-width: 100%; margin-top: -8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--display); font-style: italic; font-size: 13px; color: var(--sand); opacity: 0.8; }
.cell:hover, .cell:focus-visible { color: var(--candle); background: var(--umber); }
.cell:hover .cell-name, .cell:focus-visible .cell-name { color: var(--sand); }
.cell.is-selected { background: var(--umber-2); color: var(--candle); }
.cell.is-selected .cell-name { color: var(--candle); }

.empty { padding: 60px 0; text-align: center; color: var(--ash); }
.empty p:first-child { font-family: var(--display); font-size: 26px; color: var(--sand); margin: 0 0 18px; }
.try { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; font-size: 13px; }
.chip { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 8px; font-size: 12px; color: var(--sand); transition: color 160ms var(--ease), border-color 160ms var(--ease); }
.chip:hover { color: var(--candle); border-color: var(--rule-strong); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Detail */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 3, 0.55); animation: fade 200ms var(--ease); }
.detail { position: fixed; z-index: 21; top: var(--frame); right: var(--frame); bottom: var(--frame); width: min(440px, calc(100% - 2 * var(--frame))); overflow-y: auto; padding: calc(22px + env(safe-area-inset-top, 0px)) 28px calc(32px + env(safe-area-inset-bottom, 0px)); background: var(--umber); border-left: 1px solid var(--rule-strong); animation: slide 260ms var(--ease); }
.detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.detail-family { margin: 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); }
.detail-name { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; color: var(--candle); overflow-wrap: anywhere; }
.close { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--rule); border-radius: 9px; color: var(--ash); }
.close:hover { color: var(--candle); border-color: var(--rule-strong); }
.stage { display: grid; place-items: center; height: 220px; margin: 24px 0 8px; color: var(--candle); border: 1px solid var(--rule); border-radius: 12px; background-color: var(--ink); background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 20px 20px; background-position: center; }
.detail-label { margin: 22px 0 8px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); }
.detail-motion { margin: 0; font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.3; color: var(--sand); }
.detail .snippet { background: var(--ink); }
.detail .snippet + .snippet { margin-top: 6px; }
.sizes { display: flex; align-items: flex-end; gap: 26px; color: var(--sand); }
.size { display: grid; justify-items: center; gap: 8px; }
.size span { font-family: var(--mono); font-size: 10.5px; color: var(--ash); }
.aliases { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--sand); }

/* Footer: the last painting as the background, the big word and the credits laid over it */
.foot { position: relative; display: grid; margin: 72px calc(-1 * var(--gutter)) 0; min-height: clamp(520px, 62vw, 820px); overflow: hidden; isolation: isolate; }
.foot-bg { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
.foot::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to bottom, var(--ink) 0%, rgba(10, 8, 6, 0.35) 22%, rgba(10, 8, 6, 0.2) 50%, rgba(10, 8, 6, 0.82) 82%, rgba(10, 8, 6, 0.95) 100%); }
.foot-content { display: flex; flex-direction: column; justify-content: flex-end; padding: 0 var(--gutter) calc(18px + var(--frame)); min-width: 0; }
.foot-word { font-family: var(--display); font-weight: 300; font-size: clamp(110px, 23vw, 340px); line-height: 0.95; letter-spacing: -0.02em; text-align: center; color: var(--candle); opacity: 0.92; user-select: none; }
.foot-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; padding-block: 18px 14px; border-top: 1px solid rgba(246, 223, 174, 0.3); font-size: 12.5px; color: var(--candle); }
.foot-row p { margin: 0; }
.foot-row a { text-decoration: none; border-bottom: 1px solid rgba(246, 223, 174, 0.5); }
.foot-row a:hover { border-bottom-color: var(--candle); }
.foot-credit { margin: 0; font-family: var(--display); font-style: italic; font-size: 13.5px; color: var(--sand); }

@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }

@media (max-width: 1080px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); }
  .hero-icons { grid-column: 1 / -1; grid-row: 2; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 56px; gap: 4px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card-space { min-height: 140px; }
  .family { grid-template-columns: minmax(160px, 220px) minmax(0, 1fr); }
}
@media (max-width: 720px) {
  :root { --frame: 4px; }
  .bar { grid-template-columns: auto 1fr; }
  .bar-left { display: none; }
  .mark { justify-items: start; }
  .hero { grid-template-columns: minmax(0, 1fr); padding-top: 28px; }
  .painting { grid-row: 1; }
  .hero-icons { grid-row: auto; grid-template-columns: repeat(6, 1fr); }
  .section-head { grid-template-columns: minmax(0, 1fr); padding-top: 56px; }
  .section-head p { justify-self: start; }
  .family { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .family-art { position: static; }
  .family-art img { aspect-ratio: 16 / 9; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .search { height: 52px; }
  .search input { font-size: 20px; }
  .hover-hint { display: none; }
  .card-credit { opacity: 0.85; }
  .detail { top: auto; left: var(--frame); width: auto; max-height: 86%; border-left: 0; border-top: 1px solid var(--rule-strong); border-radius: 16px 16px 0 0; animation-name: rise; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
